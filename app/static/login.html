<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — TradeMap Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4e79'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial' font-size='15' font-weight='bold' fill='white' text-anchor='middle'%3ETM%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4f6f9; --panel: #fff; --ink: #1b2733; --muted: #6b7a8c;
      --line: #d9e1ea; --primary: #1f4e79; --accent: #00806c; --danger: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink);
    }
    .card {
      width: 100%; max-width: 400px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 32px; box-shadow: 0 1px 3px rgba(27, 39, 51, .06);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .logo {
      width: 42px; height: 42px; border-radius: 9px; flex-shrink: 0;
      background: var(--primary); color: #fff;
      display: grid; place-items: center; font-weight: 700; letter-spacing: .5px;
    }
    h1 { margin: 0; font-size: 19px; }
    .sub { margin: 0 0 26px; font-size: 13px; color: var(--muted); }
    label {
      display: block; font-size: 12.5px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px;
    }
    .field { margin-bottom: 16px; }
    input {
      font: inherit; width: 100%; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      font: inherit; font-weight: 600; width: 100%; padding: 11px;
      margin-top: 6px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--primary); color: #fff;
    }
    button:hover { filter: brightness(1.1); }
    .error {
      background: #fdeceb; border: 1px solid #f3c4c1; color: var(--danger);
      padding: 10px 12px; border-radius: 8px; margin-bottom: 18px; font-size: 13.5px;
    }
    .note { margin: 22px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .note a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="logo">TM</span>
      <h1>TradeMap Explorer</h1>
    </div>
    <p class="sub">Торговая статистика ITC — выборка и выгрузка в Excel</p>

    <div id="error" class="error" hidden></div>

    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="next" id="next" value="/">
      <div class="field">
        <label for="username">E-mail на trademap.org</label>
        <input type="email" id="username" name="username" required autofocus
               autocomplete="username" spellcheck="false"
               placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password">
      </div>
      <button type="submit">Войти</button>
    </form>

    <p class="note">
      Вход выполняется вашей учётной записью
      <a href="https://www.trademap.org" target="_blank" rel="noopener">trademap.org</a>
      — отдельной регистрации не требуется. Пароль нигде не сохраняется:
      он сразу обменивается на токен доступа.
    </p>
  </main>

  <script>
    // Показываем ошибку и запоминаем, куда вернуться после входа.
    const params = new URLSearchParams(location.search);
    const box = document.getElementById('error');
    // reason — это отказ самого сервиса, его нужно показать дословно:
    // «неверный пароль» тут было бы враньём.
    const reason = params.get('reason');
    if (reason) {
      box.textContent = reason;
      box.hidden = false;
    } else if (params.get('error')) {
      box.textContent = 'TradeMap не принял эти e-mail и пароль';
      box.hidden = false;
    }
    const next = params.get('next');
    // Принимаем только внутренние пути — чтобы форму нельзя было использовать
    // как перенаправление на чужой сайт.
    if (next && next.startsWith('/') && !next.startsWith('//')) {
      document.getElementById('next').value = next;
    }
  </script>
</body>
</html>
