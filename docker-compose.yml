# TradeMap Explorer за Caddy: HTTPS с автоматическим сертификатом Let's Encrypt
# и базовая авторизация. Наружу торчит только Caddy, само приложение доступно
# лишь внутри docker-сети.
#
# Перед первым запуском заполните .env (см. .env.example и раздел «Деплой» в README).

services:
  app:
    build: .
    image: trademap-explorer
    restart: unless-stopped
    env_file: .env
    environment:
      # Пути и режим внутри контейнера задаются здесь, а не в .env,
      # чтобы локальный запуск через ./run.sh не ломался.
      TRADEMAP_CACHE_DIR: /data
      TRADEMAP_ALLOW_BROWSER_LOGIN: "0"
      # На сервере вход в приложение обязателен — без этих трёх переменных
      # страница была бы открыта всему интернету, поэтому compose не стартует.
      TRADEMAP_APP_USER: ${TRADEMAP_APP_USER:?запустите ./setup-auth.sh}
      TRADEMAP_APP_PASSWORD_HASH: ${TRADEMAP_APP_PASSWORD_HASH:?запустите ./setup-auth.sh}
      TRADEMAP_SESSION_SECRET: ${TRADEMAP_SESSION_SECRET:?запустите ./setup-auth.sh}
    volumes:
      # Токен и кэш справочников переживают пересборку контейнера.
      - trademap-data:/data
    # Портов наружу нет: доступ только через Caddy по внутренней сети.
    expose:
      - "8765"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # UDP обязателен: Caddy объявляет заголовком alt-svc поддержку HTTP/3
      # (QUIC поверх UDP 443). Без этого проброса браузер после первого ответа
      # переключается на HTTP/3, не достучивается и падает с ERR_TOO_MANY_RETRIES,
      # тогда как curl продолжает работать по TCP.
      - "443:443/udp"
    environment:
      TRADEMAP_DOMAIN: ${TRADEMAP_DOMAIN:?укажите TRADEMAP_DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web

volumes:
  trademap-data:
  caddy-data:
  caddy-config:

networks:
  web:
